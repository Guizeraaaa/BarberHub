name: barberhub
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  google_fonts: ^6.2.1
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  fl_chart: ^1.2.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Italic.ttf
          style: italic

        - asset: assets/fonts/Barlow-Thin.ttf
          weight: 100
        - asset: assets/fonts/Barlow-ThinItalic.ttf
          weight: 100
          style: italic

        - asset: assets/fonts/Barlow-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/Barlow-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/Barlow-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-SemiBoldItalic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
        - asset: assets/fonts/Barlow-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/Barlow-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Barlow-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        - asset: assets/fonts/Barlow-Black.ttf
          weight: 900
        - asset: assets/fonts/Barlow-BlackItalic.ttf
          weight: 900
          style: italic

flutter_native_splash:
  color: "#000000"
  image: assets/images/barberhub_logo.png

  android_12:
    image: assets/images/barberhub_logo.png
    icon_background_color: "#000000"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/barberhub_logo.png"
  min_sdk_android: 21
